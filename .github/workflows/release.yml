name: Release

on:
  push:
    tags:
      - "*.*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download Dalamud dev runtime
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Path latest.zip -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        run: dotnet build KaySquadron/KaySquadron.csproj -c Release

      - name: Rename package for release asset
        shell: pwsh
        run: Copy-Item KaySquadron/bin/Release/KaySquadron/latest.zip KaySquadron/bin/Release/KaySquadron/KaySquadron.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: KaySquadron/bin/Release/KaySquadron/KaySquadron.zip
          generate_release_notes: true
